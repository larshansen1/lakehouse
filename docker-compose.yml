services:
  minio:
    image: minio/minio:RELEASE.2024-06-28T09-06-49Z
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - ./_vol/minio/data:/data
      - ./_vol/minio/config:/root/.minio

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
        until mc alias set ducklake http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD; do
          echo 'Waiting for MinIO to become available...';
          sleep 2;
        done;
        mc mb --ignore-existing ducklake/$MINIO_BUCKET_NAME;
        mc version enable ducklake/$MINIO_BUCKET_NAME;
        mc anonymous set none ducklake/$MINIO_BUCKET_NAME;
        echo 'MinIO bucket initialized with versioning enabled.';
        tail -f /dev/null;
      "
